# nginx-lab compose.yaml
services:
    nginx:
        image:  nginx:1.31.6
        volumes:
            - ./default.conf:/etc/nginx/conf.d/default.conf:ro
            - ./www:/var/www:ro
        ports:
            - "8080:80"
        environment:
            - NGINX_HOST=nginx-lab.com
            - NGINX_PORT=80
