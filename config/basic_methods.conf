server 
{
	host 127.0.0.1;
	listen 8080;
	root www;
	autoindex on;

	error_page 403 /error/HTTP403.html;
	error_page 404 /error/HTTP404.html;

	location / 
	{
		allow_methods GET DELETE;
	}
	
	location /images 
	{
		allow_methods POST GET DELETE;
		client_max_body_size 5000000;
	}

	location /uploads
	{
		autoindex off;
		allow_methods POST GET DELETE;
		client_max_body_size 5000000;	
	}
	
	location /index
	{
		index index.html;
	}

	location /redir
	{
		return 301 /home/Desktop;
	}

}
