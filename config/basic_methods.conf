server 
{
	host 127.0.0.1;
	listen 8080;
	root /home;
	autoindex on;

	location / 
	{
		allow_methods GET DELETE;
	}
	
	location /images 
	{
		allow_methods POST GET DELETE;
		client_max_body_size 5000000;
	}

	location /uploads
	{
		allow_methods POST GET DELETE;
		client_max_body_size 5000000;	
	}
	
	location /redir
	{
		return 301 /home/Desktop;
	}

	location /index
	{
		index index.html;
	}
}
