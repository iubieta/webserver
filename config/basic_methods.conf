server {
	host 127.0.0.1;
	listen 8080;
	root /home/iubieta/Documents/42/webserver/www/;

	location / {
		allow_methods POST GET DELETE;
	}
}

server {
	host 127.0.0.1;
	listen 8081;
	root /home/iubieta/Documents/42/webserver/www/server_2/;

	location / {
		allow_methods GET;
	}
	
	location /images {
		root /home/iubieta/Documents/42/webserver/www/server_2/images/;
		allow_methods POST GET DELETE;
		client_max_body_size 500000;
	}
}
